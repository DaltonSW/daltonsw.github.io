<footer class="site-footer">
  <div class="wrap site-footer__row">
    <span>© {{ now.Year }} {{ or site.Copyright site.Params.author }}</span>
    <span>built with <a href="https://gohugo.io" rel="noopener">Hugo</a></span>
    <button type="button" class="spoilers-toggle" data-spoilers-toggle aria-pressed="false" hidden></button>
    <span>have a nice day, or don't - I'm not your dad</span>
  </div>
</footer>
<script>
(function () {
  var btn = document.querySelector("[data-spoilers-toggle]");
  if (!btn) return;
  var root = document.documentElement;
  function render() {
    var on = root.classList.contains("spoilers-shown");
    btn.setAttribute("aria-pressed", String(on));
    btn.textContent = on ? "spoilers: shown" : "spoilers: hidden";
  }
  btn.hidden = false;
  render();
  btn.addEventListener("click", function () {
    var on = root.classList.toggle("spoilers-shown");
    try { localStorage.setItem("spoilers", on ? "show" : "hide"); } catch (e) {}
    render();
  });
})();
</script>
