baseURL = 'https://dalton.dog/'
title = "Dalton's Web Place"
locale = "en-US"
defaultContentLanguage = "en"

copyright = "Dalton Williams"

cleanDestinationDir = true
enableRobotsTXT = true

timezone = "America/Chicago"

# `games` is a real taxonomy so each game gets its own term page — playthroughs
# then nest under that game's directory and inherit the tag via `cascade`, with
# no per-page front matter needed. Defining [taxonomies] replaces Hugo's
# implicit tag/category defaults — unused here, so no loss.
#
# `platform` and `status` reuse the existing front-matter fields of the same
# name (every game bundle's _index.md already sets them) — singular equals
# plural here specifically so Hugo reads that field directly instead of
# needing a second, tool-maintained field. That means the handful of games
# with a comma-joined platform string (e.g. "PC, Xbox 360") become one
# composite term rather than two separate ones; accepted rather than
# reshaping the platform field, since only ~4 games are affected.
[taxonomies]
    game = "games"
    platform = "platform"
    status = "status"

# Games track real dates in `started`/`finished`; projects use `date`. Wire both
# into Hugo's canonical dates so feeds, sitemap <lastmod>, and .Date are accurate
# instead of falling back to file mod time.
[frontmatter]
    date = ['date', 'started', ':fileModTime', ':default']
    lastmod = ['lastmod', 'finished', 'started', ':fileModTime', ':default']
    publishDate = ['publishDate', 'published', 'pub', 'date', 'started', ':default']

# Individual projects live at the site root (e.g. /prism); the /projects
# section page stays the index.
[permalinks.page]
    projects = "/:slug/"

[markup.goldmark.renderer]
    unsafe = true

# Header search reads this at /search-index.json — every game and project page,
# built once at site render so the client never has to crawl pages itself.
[outputFormats.searchindex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[outputs]
    home = ["HTML", "RSS", "searchindex"]

# Public handles shown/linked on the Overview tab's provider cards
# (layouts/partials/games-overview.html). These are public profile identifiers,
# not secrets — real credentials (API keys, tokens) stay in tools/gamelog/.env,
# which Hugo never reads. Leave a provider's fields blank to show the card
# without a username/link, same as today.
[params.providers.retroachievements]
    username = "DaltonSW"
    profile_url = "https://retroachievements.org/user/DaltonSW"
[params.providers.steam]
    username = "DaltonSW"
    profile_url = "https://steamcommunity.com/id/daltonsw/"
[params.providers.xbox]
    username = ""
    profile_url = ""
[params.providers.psn]
    username = "DaltonSW"
    profile_url = ""
[params.providers.ubisoft]
    username = "DaltonSTW"
    profile_url = ""

# Vendors vis-timeline's base stylesheet from node_modules so it's addressable
# via resources.Get, same as any other asset.
[[module.mounts]]
    source = "assets"
    target = "assets"
[[module.mounts]]
    source = "node_modules/vis-timeline/styles"
    target = "assets/vendor/vis-timeline-styles"
